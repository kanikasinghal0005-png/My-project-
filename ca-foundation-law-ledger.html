<html lang="en">

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#17233A;
  --parchment:#F4EFE3;
  --paper:#FBF8F1;
  --brass:#A9793B;
  --brass-dark:#7E5A26;
  --line:#DCD2BA;
  --good-bg:#E3F0E5;
  --good-text:#2F5D42;
  --avg-bg:#F7E1DA;
  --avg-text:#8A3B2E;
  --danger-bg:#1C1A18;
  --danger-text:#F2ECDD;
  --shadow:0 2px 0 rgba(23,35,58,0.08);
}
*{box-sizing:border-box;}
body{margin:0;background:var(--parchment);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
h1,h2,h3,.display{font-family:'Fraunces',serif;}
.mono{font-family:'IBM Plex Mono',monospace;}
a{color:inherit;}
button{font-family:inherit;cursor:pointer;}

.app{display:block;min-height:100vh;}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--ink);color:var(--parchment);padding:9px 18px;box-shadow:0 1px 0 rgba(0,0,0,0.15);}
.topbar .brand{display:flex;align-items:center;gap:9px;padding-right:13px;border-right:1px solid rgba(244,239,227,0.18);flex:none;}
.topbar .brand .stamp-mark{width:24px;height:24px;border:2px solid var(--brass);border-radius:50%;display:flex;align-items:center;justify-content:center;font-family:'Fraunces',serif;font-weight:700;font-size:11px;color:var(--brass);flex:none;}
.topbar .brand h1{font-size:13.5px;margin:0;line-height:1.1;white-space:nowrap;font-weight:600;}
.tabs{display:flex;gap:4px;flex-wrap:wrap;flex:1;}
.tab{display:inline-flex;align-items:center;gap:5px;padding:6px 11px;border-radius:20px;font-size:12px;opacity:0.78;text-align:left;background:rgba(244,239,227,0.05);color:inherit;border:1px solid transparent;white-space:nowrap;}
.tab .num{font-family:'IBM Plex Mono',monospace;font-size:9.5px;opacity:0.55;}
.tab:hover{opacity:1;background:rgba(244,239,227,0.13);}
.tab.active{opacity:1;background:var(--brass);border-color:var(--brass);color:var(--ink);font-weight:600;}

main{padding:22px 32px 80px 32px;max-width:1180px;margin:0 auto;}
@media (max-width:600px){main{padding:16px 16px 70px 16px;} .topbar{padding:8px 12px;}}
.section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:6px;}
.section-head .idx{font-family:'IBM Plex Mono',monospace;color:var(--brass-dark);font-size:14px;}
.section-head h2{margin:0;font-size:26px;}
.subhead{color:#5c5342;font-size:14px;margin:0 0 24px 0;max-width:640px;}
hr.rule{border:none;border-top:1px solid var(--line);margin:18px 0;}

.card{background:var(--paper);border:1px solid var(--line);border-radius:2px;box-shadow:var(--shadow);padding:20px;margin-bottom:16px;}
.card h3{margin:0 0 4px 0;font-size:17px;}
.grid{display:grid;gap:14px;}
.grid.cols-2{grid-template-columns:repeat(2,1fr);}
.grid.cols-3{grid-template-columns:repeat(3,1fr);}
@media (max-width:700px){.grid.cols-2,.grid.cols-3{grid-template-columns:1fr;}}

.btn{display:inline-flex;align-items:center;gap:8px;padding:10px 18px;border-radius:2px;border:1px solid var(--ink);background:var(--ink);color:var(--parchment);font-size:13px;font-weight:600;letter-spacing:0.02em;}
.btn:hover{background:#233250;}
.btn.secondary{background:transparent;color:var(--ink);}
.btn.secondary:hover{background:rgba(23,35,58,0.06);}
.btn.brass{background:var(--brass);border-color:var(--brass);}
.btn.brass:hover{background:var(--brass-dark);}
.btn:disabled{opacity:0.45;cursor:not-allowed;}
.btn.small{padding:6px 12px;font-size:12px;}

select,input[type=text],input[type=number],textarea{font-family:inherit;border:1px solid var(--line);background:var(--paper);padding:9px 11px;border-radius:2px;font-size:13.5px;color:var(--ink);width:100%;}
select:focus,input:focus,textarea:focus{outline:2px solid var(--brass);outline-offset:1px;}
label{font-size:12px;text-transform:uppercase;letter-spacing:0.05em;color:#6b6250;display:block;margin-bottom:5px;}

.stamp{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-direction:column;font-family:'IBM Plex Mono',monospace;font-weight:600;font-size:9px;letter-spacing:0.03em;transform:rotate(-6deg);border:2px double currentColor;flex:none;}
.stamp.good{background:var(--good-bg);color:var(--good-text);}
.stamp.avg{background:var(--avg-bg);color:var(--avg-text);}
.stamp.danger{background:var(--danger-bg);color:var(--danger-text);border-color:#3a352f;}
.stamp b{font-size:13px;}

.chapter-row{display:flex;align-items:center;gap:16px;}
.chapter-row .meta{flex:1;}
.chapter-row .meta .act{font-size:12px;color:#6b6250;margin-top:2px;}

.tag{display:inline-block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:0.05em;padding:2px 8px;border-radius:10px;margin-bottom:8px;}
.tag.definition{background:#DDE7F5;color:#2A4A7A;}
.tag.keypoint{background:var(--good-bg);color:var(--good-text);}
.tag.exception{background:#F3E6CC;color:var(--brass-dark);}
.tag.case{background:var(--avg-bg);color:var(--avg-text);}
.tag.mnemonic{background:#EAE3F2;color:#5B3A82;}
.note-block{border-left:3px solid var(--line);padding:4px 0 4px 14px;margin-bottom:14px;}
.note-block h4{margin:0 0 4px 0;font-size:15px;}
.note-block p{margin:0;font-size:14px;line-height:1.6;color:#2c3448;}
#notes-output{max-width:760px;}
.selector-bar{display:flex;align-items:center;gap:10px;margin-bottom:16px;flex-wrap:wrap;}
.selector-bar label{margin:0;white-space:nowrap;}
.selector-bar select{width:auto;min-width:230px;}

.flash-wrap{perspective:1200px;height:200px;}
.flash{width:100%;height:100%;position:relative;transform-style:preserve-3d;transition:transform 0.5s;cursor:pointer;}
.flash.flipped{transform:rotateY(180deg);}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:4px;padding:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:15px;line-height:1.5;border:1px solid var(--line);}
.face.front{background:var(--paper);}
.face.back{background:var(--ink);color:var(--parchment);transform:rotateY(180deg);}
.flash-nav{display:flex;justify-content:space-between;align-items:center;margin-top:12px;}

.q-option{display:block;width:100%;text-align:left;padding:11px 14px;border:1px solid var(--line);background:var(--paper);border-radius:2px;margin-bottom:8px;font-size:14px;}
.q-option:hover{border-color:var(--brass);}
.q-option.selected{border-color:var(--brass);background:#F3E6CC;}
.q-option.correct{border-color:var(--good-text);background:var(--good-bg);}
.q-option.incorrect{border-color:var(--avg-text);background:var(--avg-bg);}

.chat-log{display:flex;flex-direction:column;gap:12px;max-height:440px;overflow-y:auto;padding-right:4px;}
.msg{max-width:82%;padding:11px 14px;border-radius:3px;font-size:14px;line-height:1.55;}
.msg.user{align-self:flex-end;background:var(--ink);color:var(--parchment);}
.msg.ai{align-self:flex-start;background:var(--paper);border:1px solid var(--line);}
.msg .verify{margin-top:6px;font-size:11px;color:var(--good-text);font-weight:600;text-transform:uppercase;letter-spacing:0.04em;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:0.05em;color:#6b6250;padding:8px 10px;border-bottom:2px solid var(--ink);}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle;}

.ring-wrap{display:flex;align-items:center;gap:20px;}
.ring{position:relative;width:110px;height:110px;flex:none;}
.ring svg{transform:rotate(-90deg);}

.banner{background:#F3E6CC;border:1px solid var(--brass);border-radius:2px;padding:12px 16px;font-size:13.5px;margin-bottom:18px;}
.banner.notice{background:#EAF1EC;border-color:var(--good-text);}
.empty{color:#6b6250;font-size:13.5px;font-style:italic;}
.loading{display:flex;align-items:center;gap:8px;font-size:13px;color:#6b6250;}
.spinner{width:14px;height:14px;border:2px solid var(--line);border-top-color:var(--brass);border-radius:50%;animation:spin 0.7s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

.modal-back{position:fixed;inset:0;background:rgba(23,35,58,0.55);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px;}
.modal{background:var(--paper);border-radius:3px;max-width:420px;width:100%;padding:24px;border:1px solid var(--line);}
.modal h3{margin-top:0;}
.field{margin-bottom:14px;}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:#6b6250;}

::-webkit-scrollbar{width:8px;}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px;}
</style>
</head>

<script>
/* =====================================================================
   This app runs entirely offline once loaded: no server, no API key,

   questions and doubt answers are bundled in this file. Progress is
   saved to this browser's local storage.

const CHAPTERS = [
  {id:'ch1', num:'01', title:'Indian Regulatory Framework', act:'Overview of business laws & regulators'},
  {id:'ch2', num:'02', title:'The Indian Contract Act, 1872', act:'Offer, acceptance, consideration, indemnity, guarantee, bailment, pledge, agency'},
  {id:'ch3', num:'03', title:'The Sale of Goods Act, 1930', act:'Conditions & warranties, transfer of property, unpaid seller'},
  {id:'ch4', num:'04', title:'The Indian Partnership Act, 1932', act:'Nature of partnership, rights & duties, dissolution'},
  {id:'ch5', num:'05', title:'The Limited Liability Partnership Act, 2008', act:'LLP formation, partners, incorporation'},
  {id:'ch6', num:'06', title:'The Companies Act, 2013', act:'Company formation, types, memorandum & articles'},
  {id:'ch7', num:'07', title:'The Negotiable Instruments Act, 1881', act:'Promissory notes, bills of exchange, cheques'},
];

const TABS = [
  {id:'dashboard', label:'Dashboard', num:'00'},
  {id:'notes', label:'Topper Notes', num:'01'},
  {id:'flash', label:'Flash Cards', num:'02'},
  {id:'quiz', label:'Quiz Maker', num:'03'},
  {id:'doubt', label:'Doubt Desk', num:'04'},
  {id:'tracker', label:'Prep Ledger', num:'05'},
];

/* ===================== CONTENT BANKS (bundled, offline) ===================== */

const NOTES_BANK = {
  ch1: [
    {type:'definition', heading:'What "Business Laws" covers', content:'The body of statutory rules governing commercial transactions and the conduct of business entities in India — distinct from criminal, constitutional, or family law.'},
    {type:'keypoint', heading:'Scope of this paper', content:'The paper focuses on core private commercial law — contract, sale of goods, partnership, LLP, companies, and negotiable instruments — not on regulators like SEBI or RBI in detail.'},
    {type:'keypoint', heading:'Sources of business law', content:'Statutes (Acts of Parliament), judicial precedent (court decisions), and mercantile custom/usage of trade all shape Indian business law.'},
    {type:'exception', heading:'No single code', content:'Business law isn\'t one unified code — different transaction types (sale, partnership, negotiable instruments) each have their own dedicated Act.'},
    {type:'case', heading:'Common mix-up', content:'Don\'t confuse a "law" (an Act of Parliament — primary legislation) with a "regulation" (like a SEBI circular — subordinate legislation made under delegated authority).'},
    {type:'mnemonic', heading:'Remember the 7 chapters', content:'Framework, Contract, Sale, Partnership, LLP, Companies, Negotiable instruments — "F-C-S-P-L-C-N".'},
    {type:'definition', heading:'Legislation', content:'Law enacted by a competent legislature — Parliament for central subjects, State legislatures for state subjects. This is the primary source of business law.'},
    {type:'keypoint', heading:'Judicial precedent in practice', content:'Courts generally follow the doctrine of stare decisis — lower courts are bound by the reasoning (ratio decidendi) of higher courts on the same point of law.'},
    {type:'keypoint', heading:'Hierarchy that matters for precedent', content:'Supreme Court decisions bind all courts in India; High Court decisions bind subordinate courts within that state; this hierarchy decides which precedent "wins".'},
    {type:'exception', heading:'Not every custom counts', content:'A custom is only recognised as law if it is ancient, certain, reasonable, continuous, and not opposed to any statute or public policy — a recent or unreasonable practice doesn\'t qualify.'},
    {type:'keypoint', heading:'Why this chapter matters for the rest', content:'Understanding "Act vs regulation vs custom vs precedent" here avoids confusion later when a question asks you to identify the source of a rule in Contract, Sale of Goods, or Companies law.'},
  ],
  ch2: [
    {type:'definition', heading:'Contract — Sec 2(h)', content:'An agreement enforceable by law. Every agreement is not a contract, but every contract starts life as an agreement.'},
    {type:'definition', heading:'Agreement — Sec 2(e)', content:'Every promise and every set of promises forming consideration for each other.'},
    {type:'keypoint', heading:'Essentials of a valid contract', content:'Offer & acceptance, intention to create legal relations, lawful consideration, capacity, free consent, lawful object, certainty, and possibility of performance.'},
    {type:'keypoint', heading:'Consideration', content:'Must move at the desire of the promisor; can be past, present, or future — but never illegal, immoral, or opposed to public policy.'},
    {type:'exception', heading:'"No consideration, no contract" — exceptions', content:'A written, registered promise from natural love and affection, or a written promise to pay a time-barred debt, are both valid without fresh consideration.'},
    {type:'case', heading:'Void vs voidable', content:'Common mistake: a void agreement was never enforceable (e.g. an agreement with a minor); a voidable contract is enforceable at the option of one party (e.g. one caused by coercion).'},
    {type:'keypoint', heading:'Indemnity vs Guarantee', content:'Indemnity = 2 parties, compensating for a loss. Guarantee = 3 parties (creditor, principal debtor, surety), performing/discharging a third person\'s liability on default.'},
    {type:'keypoint', heading:'Bailment vs Pledge', content:'Bailment = delivery of goods for a purpose with return/disposal as directed. Pledge = bailment of goods specifically as security for a debt — every pledge is a bailment, not every bailment is a pledge.'},
    {type:'definition', heading:'Offer & Acceptance — Sec 2(a)-(b)', content:'An offer (proposal) is a signification of willingness to do or not do something, to obtain the other party\'s assent. Acceptance is that assent given to the offer — once accepted, the proposal becomes a promise.'},
    {type:'keypoint', heading:'Communication & revocation of offer', content:'An offer can be revoked any time before acceptance is communicated, not after. Acceptance itself must be communicated to the offeror to complete the contract — silence is not acceptance.'},
    {type:'keypoint', heading:'Free consent — the five flaws', content:'Consent isn\'t "free" if caused by coercion, undue influence, fraud, misrepresentation, or mistake. The first four make a contract voidable at the aggrieved party\'s option; certain mistakes can make it void instead.'},
    {type:'keypoint', heading:'Capacity to contract — Sec 11', content:'A person must be of the age of majority, of sound mind, and not disqualified from contracting by any law they\'re subject to. Fail any one, and the agreement is void (not merely voidable) — this is why "agreement with a minor" is void, not voidable.'},
    {type:'keypoint', heading:'Discharge of a contract', content:'A contract ends by performance, mutual agreement, impossibility of performance (frustration), lapse of the agreed time, or breach — knowing all five modes helps you eliminate wrong options fast in MCQs.'},
    {type:'keypoint', heading:'Remedies for breach', content:'The aggrieved party may claim damages, seek specific performance, seek an injunction, or claim on a quantum meruit basis (payment for work actually done) — damages is the default remedy unless the facts call for another.'},
    {type:'definition', heading:'Quasi-contract', content:'An obligation the law imposes on a party as if a contract existed, even without any real agreement — its purpose is to prevent one party from being unjustly enriched at another\'s expense.'},
    {type:'exception', heading:'Wagering agreements are void', content:'Agreements by way of wager (a bet on an uncertain event) are void under Sec 30 — with narrow, specific exceptions such as certain horse-race prize contributions above a set threshold.'},
    {type:'case', heading:'Sub-agent vs substituted agent', content:'Common mix-up: a sub-agent is appointed by the agent and works under the agent\'s control; a substituted agent is named by the agent at the principal\'s instance but is treated as the principal\'s own agent, not the original agent\'s.'},
  ],
  ch3: [
    {type:'definition', heading:'Contract of sale — Sec 4', content:'The seller transfers, or agrees to transfer, property in goods to the buyer for a price.'},
    {type:'keypoint', heading:'Condition vs Warranty', content:'Condition = essential to the main purpose; breach lets the buyer repudiate. Warranty = collateral; breach only gives a right to damages.'},
    {type:'keypoint', heading:'Caveat emptor', content:'"Let the buyer beware" is the general rule — but it has real exceptions, e.g. sale by description, sale by sample, or fitness for a disclosed purpose.'},
    {type:'exception', heading:'Sale by description', content:'When goods are bought by description, there\'s an implied condition the goods will correspond to that description — an exception to blind caveat emptor.'},
    {type:'case', heading:'Sale vs agreement to sell', content:'Common mistake: in a sale, property passes immediately; in an agreement to sell, property passes later, once a condition is met or a future date arrives.'},
    {type:'mnemonic', heading:'Unpaid seller\'s rights', content:'"L-S-R" — Lien, Stoppage in transit, Right of resale.'},
    {type:'definition', heading:'"Goods" — the wide meaning', content:'Every kind of movable property except money and actionable claims — this includes stock, shares, growing crops, and things attached to land agreed to be severed before sale.'},
    {type:'keypoint', heading:'When does property (ownership) actually pass?', content:'For specific/ascertained goods, property passes when the parties intend it to (often on making the contract); for unascertained goods, property only passes once goods are ascertained and unconditionally appropriated to the contract.'},
    {type:'exception', heading:'Sale by auction', content:'Each lot in an auction is treated as a separate sale; the sale is only complete when the auctioneer announces its completion by the fall of the hammer — a bidder can retract before that moment.'},
    {type:'keypoint', heading:'Nemo dat quod non habet', content:'"No one can give what they don\'t have" — a seller generally can\'t pass a better title than they themselves hold. Real exceptions exist though, e.g. a sale by a mercantile agent in the ordinary course of business.'},
  ],
  ch4: [
    {type:'definition', heading:'Partnership — Sec 4', content:'The relation between persons who have agreed to share the profits of a business carried on by all, or any of them acting for all.'},
    {type:'keypoint', heading:'Three essentials', content:'An agreement, sharing of profits, and mutual agency (the business is carried on by all, or any acting for all).'},
    {type:'keypoint', heading:'Registration is optional', content:'Registering a firm isn\'t compulsory — but an unregistered firm can\'t sue a third party (or another partner) to enforce a contractual right.'},
    {type:'exception', heading:'Profit-sharing isn\'t conclusive', content:'Sharing profits is evidence of partnership, not proof by itself — e.g. a manager paid a profit-linked salary isn\'t automatically a partner.'},
    {type:'case', heading:'No deed needed', content:'Common mistake: assuming a written partnership deed is compulsory — an oral agreement is equally valid in law, though a deed helps avoid disputes.'},
    {type:'mnemonic', heading:'Remember partnership as', content:'"APM" — Agreement + Profit-sharing + Mutual agency.'},
    {type:'keypoint', heading:'Types of partners', content:'Active partner (works & shares liability), sleeping/dormant partner (invests & shares liability, doesn\'t manage), nominal partner (lends their name, no real stake), and a partner in profits only (shares profits, not losses, to third parties).'},
    {type:'exception', heading:'A minor\'s position in a firm', content:'A minor can\'t be a full partner, but can be admitted to the benefits of an existing partnership with the other partners\' consent — sharing profits, but never personally liable for the firm\'s losses.'},
    {type:'keypoint', heading:'Modes of dissolution', content:'A firm can dissolve by mutual agreement, compulsorily (e.g. all partners or all but one becoming insolvent), on a contingency (like the end of a fixed term), by one partner\'s notice (in a partnership at will), or by court order.'},
    {type:'case', heading:'Partnership at will', content:'Common mix-up: not every partnership needs a fixed end date — a "partnership at will" simply continues until any partner gives notice of intention to dissolve it.'},
  ],
  ch5: [
    {type:'definition', heading:'What is an LLP', content:'A body corporate with perpetual succession and a legal identity separate from its partners — blending features of a company and a partnership.'},
    {type:'keypoint', heading:'Limited liability', content:'Unlike a traditional partnership, a partner\'s liability in an LLP is limited to their agreed contribution.'},
    {type:'keypoint', heading:'Minimum partners', content:'At least 2 partners are needed to incorporate an LLP; there\'s no upper limit on the maximum.'},
    {type:'exception', heading:'Liability isn\'t absolute', content:'A partner can still be personally liable for their own wrongful act or fraud, and the LLP itself can face unlimited liability in cases of fraud.'},
    {type:'case', heading:'Not just "limited liability partnership" in name', content:'Common mistake: an LLP is a separate body corporate — not a traditional partnership with a liability clause bolted on.'},
    {type:'mnemonic', heading:'Remember LLP as', content:'"Limited liability of a company + flexibility of a partnership."'},
    {type:'keypoint', heading:'Incorporating an LLP', content:'Requires filing incorporation documents and a statement of compliance with the Registrar; once satisfied, the Registrar issues a Certificate of Incorporation, giving the LLP its legal existence.'},
    {type:'keypoint', heading:'Designated partners', content:'Every LLP must have at least 2 designated partners, and at least one of them must be resident in India — they carry specific responsibility for regulatory compliance.'},
    {type:'keypoint', heading:'What governs day-to-day rights', content:'The LLP Agreement sets out mutual rights and duties between partners; if there\'s no agreement on a point, the LLP Act\'s default provisions (in its Schedule) fill the gap.'},
  ],
  ch6: [
    {type:'definition', heading:'What is a company', content:'An artificial person, created by law, with a separate legal entity, perpetual succession, and (where adopted) a common seal.'},
    {type:'keypoint', heading:'Separate legal entity', content:'A company is legally distinct from its members — the foundation of the "corporate veil" concept.'},
    {type:'keypoint', heading:'MoA vs AoA', content:'The Memorandum of Association defines the company\'s objects (its charter, and supreme document). The Articles of Association contain internal management rules and must not conflict with the MoA.'},
    {type:'exception', heading:'Lifting the corporate veil', content:'Courts can disregard a company\'s separate identity in specific situations — such as fraud or improper conduct — piercing the fiction of separate personality.'},
    {type:'case', heading:'Private vs public — not just naming', content:'Common mistake: thinking "Ltd"/"Pvt Ltd" is just a label — a private company restricts share transfer and invitations to the public; a public company doesn\'t, and the two follow different rules.'},
    {type:'mnemonic', heading:'Company features', content:'"S-P-L-C" — Separate legal entity, Perpetual succession, Limited liability, Common seal/transferable shares.'},
    {type:'keypoint', heading:'Main types of companies', content:'Private company (restricts share transfer & public invitations), public company (doesn\'t), One Person Company (single member), Section 8 company (not-for-profit, applies profits to its objects), and government company (majority government shareholding) — each follows its own specific rules.'},
    {type:'keypoint', heading:'How a company is incorporated', content:'The promoters reserve a name, then file incorporation documents — including the MoA and AoA — with the Registrar of Companies, who issues a Certificate of Incorporation once satisfied.'},
    {type:'definition', heading:'Promoter', content:'A person who takes the steps needed to bring a company into existence — conceiving the idea, arranging capital, and getting it registered. A promoter owes fiduciary duties to the company they form.'},
    {type:'keypoint', heading:'Prospectus', content:'A document inviting the public to subscribe for a company\'s shares or debentures. It must make specified disclosures and must not contain misleading statements — investors rely on it to decide.'},
    {type:'keypoint', heading:'Key Managerial Personnel (KMP)', content:'Typically includes the CEO/Managing Director, the Company Secretary, and the CFO — each carries distinct statutory duties and is directly accountable under the Act.'},
  ],
  ch7: [
    {type:'definition', heading:'Negotiable instrument', content:'A document — like a promissory note, bill of exchange, or cheque — transferable by delivery or endorsement, giving a holder in due course good title even if an earlier holder\'s title was defective.'},

/* ===================== STATE & STORAGE ===================== */

let state = {
  tab: 'dashboard',
  chapterStatus: {},
  quizHistory: [],
  studyLog: [],
  doubtHistory: [],
  reminder: {enabled:false, timesPerDay:10, todayDate:'', todayCount:0, lastSlot:-1},
  quizSession: null,
};

let memoryFallback = {}; // used only if localStorage is unavailable
let storageWorks = true;

function storageGet(key){
  try{
    const raw = localStorage.getItem('lawledger:'+key);
    return raw ? JSON.parse(raw) : null;
  }catch(e){
    storageWorks = false;
    return memoryFallback[key] !== undefined ? memoryFallback[key] : null;
  }
}
function storageSet(key, value){
  try{
    localStorage.setItem('lawledger:'+key, JSON.stringify(value));
  }catch(e){
    storageWorks = false;
    memoryFallback[key] = value;
  }
}
function loadAll(){
  const keys = ['chapterStatus','quizHistory','studyLog','doubtHistory','reminder'];
  keys.forEach(k=>{
    const v = storageGet(k);
    if(v !== null) state[k] = v;
  });
}
function save(key){
  storageSet(key, state[key]);
}
function getStatus(chId){
  return state.chapterStatus[chId] || {status:'danger', quizAvg:null, lastStudied:null, hours:0, manual:false};
}
function setStatus(chId, patch){
  state.chapterStatus[chId] = Object.assign(getStatus(chId), patch);
  save('chapterStatus');
}
function computeStatusFromAvg(avg){
  if(avg===null||avg===undefined) return 'danger';
  if(avg>=75) return 'good';
  if(avg>=40) return 'avg';
  return 'danger';
}
function escapeHTML(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function todayKey(){ return new Date().toISOString().slice(0,10); }
function shuffle(arr){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ===================== RENDER SHELL ===================== */
function renderRail(){
  const rail = document.getElementById('rail');
  rail.innerHTML = '';
  TABS.forEach(t=>{
    const b = document.createElement('button');
    b.className = 'tab' + (state.tab===t.id?' active':'');
    b.innerHTML = '<span class="num">'+t.num+'</span><span>'+t.label+'</span>';
    b.onclick = ()=>{ state.tab=t.id; render(); };
    rail.appendChild(b);
  });
}
function render(){
  renderRail();
  const main = document.getElementById('main');
  main.innerHTML = '';
  if(!storageWorks){
    const w = document.createElement('div');
    w.className = 'banner';
    w.innerHTML = 'Your browser is blocking local storage (private/incognito mode can do this), so progress won\'t be saved between visits — everything else still works.';
    main.appendChild(w);
  }
  if(state.tab==='dashboard') renderDashboard(main);
  else if(state.tab==='notes') renderNotes(main);
  else if(state.tab==='flash') renderFlash(main);
  else if(state.tab==='quiz') renderQuiz(main);
  else if(state.tab==='doubt') renderDoubt(main);
  else if(state.tab==='tracker') renderTracker(main);
}

/* ===================== DASHBOARD ===================== */
function overallReadiness(){
  let sum=0, n=0;
  CHAPTERS.forEach(c=>{
    const s = getStatus(c.id);
    const v = s.status==='good'?100:s.status==='avg'?55:10;
    sum+=v; n++;
  });
  return Math.round(sum/n);
}
function ringSVG(pct, size, color){
  const r = (size/2)-8, c = 2*Math.PI*r;
  const off = c - (pct/100)*c;
  return '<svg width="'+size+'" height="'+size+'"><circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="#DCD2BA" stroke-width="8" fill="none"/>' +
    '<circle cx="'+size/2+'" cy="'+size/2+'" r="'+r+'" stroke="'+color+'" stroke-width="8" fill="none" stroke-dasharray="'+c+'" stroke-dashoffset="'+off+'" stroke-linecap="round"/></svg>';
}
function ensureTodayReminder(){
  if(state.reminder.todayDate !== todayKey()){
    state.reminder.todayDate = todayKey();
    state.reminder.todayCount = 0;
    state.reminder.lastSlot = -1;
    save('reminder');
  }
}
function renderDashboard(main){
  ensureTodayReminder();
  const readiness = overallReadiness();
  const goodCt = CHAPTERS.filter(c=>getStatus(c.id).status==='good').length;
  const avgCt = CHAPTERS.filter(c=>getStatus(c.id).status==='avg').length;
  const dangerCt = CHAPTERS.filter(c=>getStatus(c.id).status==='danger').length;

  wrap.innerHTML = `

      <div class="card">
        <h3>Overall readiness</h3>
        <div class="ring-wrap" style="margin-top:10px;">
          ${ringSVG(readiness,110,readiness>=75?'#2F5D42':readiness>=45?'#8A3B2E':'#1C1A18')}
          <div>
            <div style="font-family:'Fraunces',serif;font-size:30px;line-height:1;margin-bottom:6px;">${readiness}%</div>
            <div style="font-size:12.5px;color:#6b6250;">${goodCt} ready · ${avgCt} needs work · ${dangerCt} untouched</div>
          </div>
        </div>
      </div>
      <div class="card" id="rollcall-card"></div>
    </div>
    <h3 style="margin-top:26px;">Chapter stamps</h3>
    <div class="grid cols-2" id="chapter-stamps"></div>
  `;
  main.appendChild(wrap);
  renderRollcall(document.getElementById('rollcall-card'));
  const grid = document.getElementById('chapter-stamps');
  CHAPTERS.forEach(c=>{
    const s = getStatus(c.id);
    const label = s.status==='good'?'GOOD':s.status==='avg'?'AVG':'DANGER';
    const cls = s.status==='good'?'good':s.status==='avg'?'avg':'danger';
    const div = document.createElement('div');
    div.className='card chapter-row';
    div.innerHTML = `
      <div class="stamp ${cls}"><span>${label}</span><b>${c.num}</b></div>
      <div class="meta">
        <h3>${c.title}</h3>
        <div class="act">${c.act}</div>
        <div style="font-size:12px;color:#6b6250;margin-top:4px;">Last studied: ${s.lastStudied||'never'} · Quiz avg: ${s.quizAvg!==null&&s.quizAvg!==undefined?s.quizAvg+'%':'—'}</div>
      </div>

function renderRollcall(card){
  const r = state.reminder;
  card.innerHTML = `
    <h3>Daily roll-call</h3>
    <p class="subhead" style="margin-bottom:14px;">Ask to be nudged to study ${r.timesPerDay} times a day while this tab is open. Each nudge logs what you studied — or why you didn't.</p>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:14px;">
      ${ringSVG(Math.min(100,(r.todayCount/r.timesPerDay)*100),88,'#A9793B')}
      <div>
        <div style="font-family:'Fraunces',serif;font-size:22px;">${r.todayCount} / ${r.timesPerDay}</div>
        <div style="font-size:12px;color:#6b6250;">sittings logged today</div>
      </div>
    </div>
    <div style="display:flex;gap:10px;flex-wrap:wrap;">
      <button class="btn ${r.enabled?'secondary':'brass'} small" id="toggle-reminder">${r.enabled?'Reminders on — turn off':'Turn on reminders'}</button>
      <button class="btn secondary small" id="log-now">Log a sitting now</button>
    </div>
    <p style="font-size:11.5px;color:#6b6250;margin-top:12px;">Note: nudges only fire while this browser tab is open — there's no background push here. Keep the tab around during study hours (8am–10pm) for the full effect.</p>
  `;
  card.querySelector('#toggle-reminder').onclick = async ()=>{
    if(!r.enabled){
      if('Notification' in window){ try{ await Notification.requestPermission(); }catch(e){} }
      r.enabled = true;
    } else { r.enabled = false; }
    save('reminder');
    render();

  card.querySelector('#log-now').onclick = ()=> openStudyLogModal();
}

function openStudyLogModal(prefillPrompt){
  const root = document.getElementById('modal-root');
  root.innerHTML = `
    <div class="modal-back">
      <div class="modal" style="position:relative;">
        <button class="close-x" id="mclose">✕</button>
        <h3>Log this sitting</h3>
        <p class="subhead">${prefillPrompt||'Did you study Business Laws just now?'}</p>
        <div class="field">
          <label>Did you study?</label>
          <div style="display:flex;gap:10px;">
            <button class="btn small brass" id="yes-btn">Yes</button>
            <button class="btn small secondary" id="no-btn">No</button>
          </div>
        </div>
        <div id="log-detail"></div>
      </div>
    </div>
  `;
  document.getElementById('mclose').onclick = ()=> root.innerHTML='';
  document.getElementById('yes-btn').onclick = ()=>{
    document.getElementById('log-detail').innerHTML = `
      <div class="field"><label>Which chapter?</label>
        <select id="log-ch">${CHAPTERS.map(c=>'<option value="'+c.id+'">'+c.num+' — '+c.title+'</option>').join('')}</select>
      </div>
      <div class="field"><label>Minutes studied</label><input type="number" id="log-min" value="30" min="5"></div>
      <button class="btn brass small" id="save-log">Save</button>
    `;
    document.getElementById('save-log').onclick = ()=>{
      const chId = document.getElementById('log-ch').value;
      const mins = parseInt(document.getElementById('log-min').value)||0;
      state.studyLog.push({date:todayKey(), chapter:chId, studied:true, minutes:mins, ts:Date.now()});
      save('studyLog');
      const s = getStatus(chId);
      setStatus(chId, {lastStudied:todayKey(), hours: Math.round(((s.hours||0)+mins/60)*10)/10});
      state.reminder.todayCount++;
      save('reminder');
      root.innerHTML='';
      render();
    };
  };
  document.getElementById('no-btn').onclick = ()=>{
    document.getElementById('log-detail').innerHTML = `
      <div class="field"><label>Why not?</label><textarea id="log-reason" rows="3" placeholder="e.g. college assignment, felt unwell, ran out of time..."></textarea></div>
      <button class="btn brass small" id="save-reason">Save</button>
    `;
    document.getElementById('save-reason').onclick = ()=>{
      const reason = document.getElementById('log-reason').value;
      state.studyLog.push({date:todayKey(), studied:false, reason:reason, ts:Date.now()});
      save('studyLog');
      state.reminder.todayCount++;
      save('reminder');
      root.innerHTML='';
      render();
    };
  };
}

setInterval(()=>{
  ensureTodayReminder();
  const r = state.reminder;
  if(!r.enabled) return;
  const now = new Date();
  const startH=8, endH=22;
  const hour = now.getHours() + now.getMinutes()/60;
  if(hour<startH || hour>endH) return;
  const slotWidth = (endH-startH)/r.timesPerDay;
  const slot = Math.floor((hour-startH)/slotWidth);
  if(slot>r.lastSlot && r.todayCount<r.timesPerDay){
    r.lastSlot = slot;
    save('reminder');
    if('Notification' in window && Notification.permission==='granted'){
      try{ new Notification('Time to study Business Laws', {body:'Log what you studied — or why not.'}); }catch(e){}
    }
    openStudyLogModal('Nudge '+(slot+1)+' of '+r.timesPerDay+' — did you study Business Laws just now?');
  }
}, 30000);

/* ===================== FLASHCARDS ===================== */
let flashIndex = 0, flashFlipped = false;
function renderFlash(main){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="section-head"><span class="idx mono">Sec. 02</span><h2>Flash Cards</h2></div>
    <p class="subhead">Quick-fire recall. Front carries the question or term, back carries the answer.</p>
    <div class="selector-bar"><label>Chapter</label><select id="flash-ch">${CHAPTERS.map(c=>'<option value="'+c.id+'">'+c.num+' — '+c.title+'</option>').join('')}</select></div>
    <div id="flash-output"></div>
  `;
  main.appendChild(wrap);
  document.getElementById('flash-ch').onchange = ()=>{ flashIndex=0; flashFlipped=false; renderCachedFlash(); };
  renderCachedFlash();
}
function renderCachedFlash(){
  const chId = document.getElementById('flash-ch').value;
  const cards = FLASH_BANK[chId] || [];
  const out = document.getElementById('flash-output');
  paintFlash(out, cards);
}
function paintFlash(out, cards){
  if(!cards.length){ out.innerHTML = '<p class="empty">No flash cards available for this chapter.</p>'; return; }
  if(flashIndex>=cards.length) flashIndex=0;
  const card = cards[flashIndex];
  out.innerHTML = `
    <div class="card">
      <div class="flash-wrap"><div class="flash ${flashFlipped?'flipped':''}" id="flash-el">
        <div class="face front">${escapeHTML(card.front)}</div>
        <div class="face back">${escapeHTML(card.back)}</div>
      </div></div>
      <div class="flash-nav">
        <button class="btn secondary small" id="fp">‹ Prev</button>
        <span class="mono" style="font-size:12px;color:#6b6250;">${flashIndex+1} / ${cards.length} — tap card to flip</span>
        <button class="btn secondary small" id="fn">Next ›</button>
      </div>
    </div>
  `;
  document.getElementById('flash-el').onclick = ()=>{ flashFlipped=!flashFlipped; paintFlash(out,cards); };
  document.getElementById('fp').onclick = ()=>{ flashIndex=(flashIndex-1+cards.length)%cards.length; flashFlipped=false; paintFlash(out,cards); };
  document.getElementById('fn').onclick = ()=>{ flashIndex=(flashIndex+1)%cards.length; flashFlipped=false; paintFlash(out,cards); };
}

      <select id="quiz-chapters" multiple size="4">
        <option value="all" selected>All chapters</option>
        ${CHAPTERS.map(c=>'<option value="'+c.id+'">'+c.num+' — '+c.title+'</option>').join('')}
      </select>
      <p style="font-size:11px;color:#6b6250;margin-top:4px;">Ctrl/Cmd-click to pick specific chapters, or leave "All chapters" selected.</p>
    </div>
    <div class="grid cols-2">
      <div class="field"><label>Difficulty</label>
        <select id="quiz-diff">
          <option value="easy">Easy</option>
          <option value="medium" selected>Medium</option>
          <option value="hard">Hard</option>
          <option value="mixed">Mixed (easy + medium + hard)</option>
        </select>
      </div>
      <div class="field"><label>Total marks: <span id="marks-val">40</span></label>
        <input type="range" id="quiz-marks" min="20" max="100" step="5" value="40">
      </div>
    </div>
    <button class="btn brass" id="start-quiz">Generate quiz</button>
  `;
  document.getElementById('quiz-marks').oninput = (e)=>{ document.getElementById('marks-val').textContent = e.target.value; };
  document.getElementById('start-quiz').onclick = startQuiz;
}
function startQuiz(){
  const sel = [...document.getElementById('quiz-chapters').selectedOptions].map(o=>o.value);
  const chapters = sel.includes('all') ? CHAPTERS : CHAPTERS.filter(c=>sel.includes(c.id));
  const diff = document.getElementById('quiz-diff').value;
  const marks = parseInt(document.getElementById('quiz-marks').value);
  const area = document.getElementById('quiz-area');

  let pool = [];
  chapters.forEach(c=>{
    const qs = QUIZ_BANK[c.id] || [];
    qs.forEach(q=>{
      if(diff==='mixed' || q.difficulty===diff) pool.push(q);
    });
  });
  if(pool.length===0){
    area.innerHTML = '<div class="card"><p class="empty">No questions available for that combination — try a different difficulty or add more chapters.</p></div>';
    return;
  }
  pool = shuffle(pool);
  let questions = [];
  let repeated = false;
  for(let i=0;i<marks;i++){
    if(i<pool.length) questions.push(pool[i]);
    else { questions.push(pool[i % pool.length]); repeated = true; }
  }
  state.quizSession = {
    questions, repeated,
    chapters: chapters.map(c=>c.id),
    diff, marks: questions.length,
    answers: new Array(questions.length).fill(null),
    submitted: false,
    idx: 0
  };
  paintQuiz(area);
}
function paintQuiz(area){
  const s = state.quizSession;
  if(!s){ area.innerHTML=''; return; }
  if(!s.submitted){
    const q = s.questions[s.idx];
    area.innerHTML = `
      ${s.repeated && s.idx===0 ? '<div class="banner">This selection didn\'t have enough unique questions for '+s.marks+' marks, so some repeat — pick more chapters or a wider difficulty for full variety.</div>' : ''}
      <div class="card">
        <div style="display:flex;justify-content:space-between;font-size:12px;color:#6b6250;margin-bottom:10px;">
          <span>Question ${s.idx+1} of ${s.questions.length}</span>
          <span class="mono">${(q.difficulty||'').toUpperCase()} · 1 mark</span>
        </div>
        <h3 style="margin-bottom:14px;">${escapeHTML(q.q)}</h3>
        <div id="opts">${q.options.map((o,i)=>'<button class="q-option'+(s.answers[s.idx]===i?' selected':'')+'" data-i="'+i+'">'+escapeHTML(o)+'</button>').join('')}</div>
        <div style="display:flex;justify-content:space-between;margin-top:16px;">
          <button class="btn secondary small" id="q-prev" ${s.idx===0?'disabled':''}>‹ Prev</button>
          ${s.idx===s.questions.length-1 ? '<button class="btn brass small" id="q-submit">Submit quiz</button>' : '<button class="btn secondary small" id="q-next">Next ›</button>'}
        </div>
      </div>
    `;
    [...area.querySelectorAll('.q-option')].forEach(btn=>{
      btn.onclick = ()=>{ s.answers[s.idx] = parseInt(btn.dataset.i); paintQuiz(area); };
    });
    const prevB = document.getElementById('q-prev'); if(prevB) prevB.onclick = ()=>{ s.idx--; paintQuiz(area); };
    const nextB = document.getElementById('q-next'); if(nextB) nextB.onclick = ()=>{ s.idx++; paintQuiz(area); };
    const subB = document.getElementById('q-submit'); if(subB) subB.onclick = ()=> submitQuiz(area);
  } else {
    const score = s.answers.filter((a,i)=>a===s.questions[i].answer).length;
    const pct = Math.round((score/s.questions.length)*100);
    area.innerHTML = `
      <div class="card">
        <h3>Result: ${score} / ${s.questions.length} (${pct}%)</h3>
        <p class="subhead">Chapter status updates below have been recorded to your Prep Ledger.</p>
      </div>
      <div class="card" style="max-height:480px;overflow-y:auto;">
        ${s.questions.map((q,i)=>{
          const correct = s.answers[i]===q.answer;
          return '<div class="note-block"><span class="tag '+(correct?'keypoint':'case')+'">'+(correct?'Correct':'Review')+'</span><h4>'+escapeHTML(q.q)+'</h4>' +
            q.options.map((o,oi)=>{
              let cls='q-option';
              if(oi===q.answer) cls+=' correct';
              else if(oi===s.answers[i]) cls+=' incorrect';
              return '<div class="'+cls+'" style="pointer-events:none;">'+escapeHTML(o)+'</div>';
            }).join('') +
            '<p style="font-size:13px;color:#6b6250;margin-top:6px;">'+escapeHTML(q.explanation||'')+'</p></div>';
        }).join('')}
      </div>
      <button class="btn secondary" id="new-quiz">Build another quiz</button>
    `;
    document.getElementById('new-quiz').onclick = ()=>{ state.quizSession=null; render(); };
  }
}
function submitQuiz(area){
  const s = state.quizSession;
  s.submitted = true;
  const score = s.answers.filter((a,i)=>a===s.questions[i].answer).length;
  const pct = Math.round((score/s.questions.length)*100);
  state.quizHistory.push({date:todayKey(), chapters:s.chapters, diff:s.diff, total:s.questions.length, score, pct});
  save('quizHistory');
  s.chapters.forEach(chId=>{
    const cur = getStatus(chId);
    const newAvg = cur.quizAvg===null||cur.quizAvg===undefined ? pct : Math.round((cur.quizAvg+pct)/2);
    setStatus(chId, {quizAvg:newAvg, status: computeStatusFromAvg(newAvg)});
  });
  paintQuiz(area);
}

/* ===================== DOUBT DESK ===================== */
function renderDoubt(main){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="section-head"><span class="idx mono">Sec. 04</span><h2>Doubt Desk</h2></div>
    <p class="subhead">Ask anything from the seven Business Laws chapters. Answers are matched against a bundled bank of verified explanations, so this works offline too.</p>
    <div class="card">
      <div class="chat-log" id="chat-log"></div>
      <div style="display:flex;gap:8px;margin-top:14px;">
        <input type="text" id="doubt-input" placeholder="e.g. What's the difference between condition and warranty?">
        <button class="btn brass" id="doubt-send">Ask</button>
      </div>
    </div>
  `;
  main.appendChild(wrap);
  paintChat();
  document.getElementById('doubt-send').onclick = sendDoubt;
  document.getElementById('doubt-input').addEventListener('keydown', e=>{ if(e.key==='Enter') sendDoubt(); });
}
function paintChat(){
  const log = document.getElementById('chat-log');
  if(!log) return;
  if(state.doubtHistory.length===0){ log.innerHTML = '<p class="empty">No doubts asked yet — try one above.</p>'; return; }
  log.innerHTML = state.doubtHistory.map(m=>
    '<div class="msg user">'+escapeHTML(m.q)+'</div>' +
    '<div class="msg ai">'+escapeHTML(m.a)+(m.verify?'<div class="verify">✓ '+escapeHTML(m.verify)+'</div>':'')+'</div>'
  ).join('');
  log.scrollTop = log.scrollHeight;
}
function searchFAQ(query){
  const words = query.toLowerCase().replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(w=>w.length>2);
  let best = null, bestScore = 0;
  FAQ_BANK.forEach(entry=>{
    let score = 0;
    entry.keywords.forEach(k=>{
      if(words.some(w=>w.includes(k) || k.includes(w))) score++;
    });
    if(score>bestScore){ bestScore=score; best=entry; }
  });
  return bestScore>0 ? best : null;
}
function sendDoubt(){
  const input = document.getElementById('doubt-input');
  const q = input.value.trim();
  if(!q) return;
  input.value='';
  const match = searchFAQ(q);
  let answer, verify;
  if(match){
    answer = match.answer;
    verify = match.verify;
  } else {
    const topics = FAQ_BANK.slice(0,4).map(f=>f.keywords[0]).join(', ');
    answer = 'I don\'t have a ready answer bundled for that exact doubt yet. Try rephrasing with the key legal terms involved (e.g. "condition vs warranty", "indemnity vs guarantee"), or check the Topper Notes for the relevant chapter. Common topics I can answer well: '+topics+', and more.';
    verify = '';
  }
  state.doubtHistory.push({q, a:answer, verify, ts:Date.now()});
  save('doubtHistory');
  paintChat();
}

/* ===================== PREP TRACKER ===================== */
function renderTracker(main){
  const wrap = document.createElement('div');
  wrap.innerHTML = `
    <div class="section-head"><span class="idx mono">Sec. 05</span><h2>Prep Ledger</h2></div>
    <p class="subhead">Every chapter's standing — auto-scored from your quiz history, or set it yourself.</p>
    <div class="card">
      <table>
        <thead><tr><th>Ch.</th><th>Chapter</th><th>Status</th><th>Quiz avg</th><th>Last studied</th><th>Hours logged</th><th>Override</th></tr></thead>
        <tbody id="tracker-body"></tbody>
      </table>
    </div>
    <h3>Study log</h3>
    <div class="card" id="study-log-card"></div>
  `;
  main.appendChild(wrap);
  const body = document.getElementById('tracker-body');
  CHAPTERS.forEach(c=>{
    const s = getStatus(c.id);
    const tr = document.createElement('tr');
    const cls = s.status==='good'?'good':s.status==='avg'?'avg':'danger';
    const label = s.status==='good'?'Good':s.status==='avg'?'Average':'Danger';
    tr.innerHTML = `
      <td class="mono">${c.num}</td>
      <td>${c.title}</td>
      <td><span class="stamp ${cls}" style="width:38px;height:38px;font-size:8px;"><b style="font-size:10px;">${label}</b></span></td>
      <td>${s.quizAvg!==null&&s.quizAvg!==undefined?s.quizAvg+'%':'—'}</td>
      <td>${s.lastStudied||'never'}</td>
      <td>${s.hours||0}</td>
      <td><select data-ch="${c.id}" class="override-sel">
          <option value="">auto</option>
          <option value="good" ${s.manual&&s.status==='good'?'selected':''}>Good</option>
          <option value="avg" ${s.manual&&s.status==='avg'?'selected':''}>Average</option>
          <option value="danger" ${s.manual&&s.status==='danger'?'selected':''}>Danger</option>
        </select></td>
    `;
    body.appendChild(tr);
  });
  [...body.querySelectorAll('.override-sel')].forEach(sel=>{
    sel.onchange = ()=>{
      const chId = sel.dataset.ch;
      if(sel.value===''){ setStatus(chId, {manual:false, status: computeStatusFromAvg(getStatus(chId).quizAvg)}); }
      else { setStatus(chId, {manual:true, status: sel.value}); }
      render();
    };
  });
  const logCard = document.getElementById('study-log-card');
  const recent = state.studyLog.slice(-15).reverse();
  if(recent.length===0){ logCard.innerHTML = '<p class="empty">No sittings logged yet.</p>'; }
  else {
    logCard.innerHTML = recent.map(l=>{
      if(l.studied){
        const ch = CHAPTERS.find(c=>c.id===l.chapter);
        return '<div class="note-block"><span class="tag keypoint">Studied</span><p>'+l.date+' — '+(ch?ch.title:'')+' · '+l.minutes+' min</p></div>';
      } else {
        return '<div class="note-block"><span class="tag case">Skipped</span><p>'+l.date+' — '+escapeHTML(l.reason||'no reason given')+'</p></div>';
      }
    }).join('');
  }
}

/* ===================== BOOT ===================== */
loadAll();
render();
</script>
